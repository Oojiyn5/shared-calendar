<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>공유 캘린더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">C</span>
      <span class="brand-name">공유 캘린더</span>
    </div>
    <div class="top-actions">
      <span class="sync offline" id="syncStatus" role="status">연결 중…</span>
      <button class="btn btn-ghost" id="todayBtn" type="button">오늘</button>
    </div>
  </header>

  <main class="layout">
    <section class="calendar card" aria-label="월간 달력">
      <div class="month-nav">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <h1 class="month-title" id="monthTitle"></h1>
        <button class="icon-btn" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>

      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="grid" id="calendarGrid"></div>
    </section>

    <aside class="day-panel card" aria-label="선택한 날짜의 일정">
      <div class="day-head">
        <p class="day-label" id="dayLabel"></p>
        <span class="count" id="dayCount"></span>
      </div>

      <ul class="event-list" id="eventList"></ul>

      <form class="add-form" id="addForm">
        <input class="input" id="eventTitle" type="text" placeholder="새 일정 제목" autocomplete="off" maxlength="60" required>
        <select class="input" id="eventCategory" aria-label="카테고리"></select>
        <div class="row">
          <input class="input" id="eventStart" type="time" aria-label="시작 시간">
          <input class="input" id="eventEnd" type="time" aria-label="끝 시간">
        </div>
        <textarea class="input memo-input" id="eventMemo" rows="2" maxlength="500" placeholder="메모 (선택)"></textarea>
        <button class="btn btn-primary" type="submit">일정 추가</button>
      </form>

      <section class="categories" aria-label="카테고리 관리">
        <h2 class="section-title">카테고리</h2>
        <ul class="cat-list" id="catList"></ul>
        <form class="cat-form" id="catForm">
          <input class="input" id="catName" type="text" placeholder="새 카테고리 이름 (예: 공부)" autocomplete="off" maxlength="12" required>
          <div class="swatches" id="swatches" role="radiogroup" aria-label="카테고리 색"></div>
          <button class="btn btn-ghost" type="submit">카테고리 추가</button>
        </form>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
